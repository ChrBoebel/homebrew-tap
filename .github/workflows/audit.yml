name: Audit casks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  audit:
    # Uses the Homebrew preinstalled on GitHub's macOS images; no third-party actions.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Homebrew
        # Style cops and audits change between Homebrew releases; check with the current one.
        run: brew update --quiet

      - name: Tap this checkout as chrboebel/tap
        run: |
          taps="$(brew --repository)/Library/Taps/chrboebel"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          # This job only evaluates the checked-out pull request; trust it so tap-wide commands load it.
          brew trust chrboebel/tap
          brew tap

      - name: brew style
        run: brew style chrboebel/tap

      - name: brew audit
        # --online downloads both DMGs (about 1 GB each) and verifies their sha256.
        run: brew audit --cask --strict --online --arch all --tap chrboebel/tap
